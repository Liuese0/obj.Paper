<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>obj.Paper — Main Screen Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #F3F0E9;          /* Parchment */
    --accent: #D97757;       /* Terracotta */
    --accent-hover: #C06644;
    --accent-light: #F2DED5; /* Blush */
    --surface: #FDFCF8;      /* Warm White */
    --surface-2: #EAE7DE;    /* Sand */
    --ink: #2C2820;
    --dust: #7A7268;
    --mist: #B0A99E;
    --border: #D8D3C9;
    --success: #27AE60;
    --info: #2980B9;
    --error: #C0392B;
    --shadow: 0 30px 80px -20px rgba(44,40,32,.28), 0 8px 24px -10px rgba(44,40,32,.18);
  }
  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% 0%, #ECE6D7 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 100%, #E5DFCE 0%, transparent 60%),
      #DCD5C2;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 28px 48px;
  }
  #root{ width:100%; max-width: 1480px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

// ---------- design tokens reused inline ----------
const C = {
  bg:'#F3F0E9', accent:'#D97757', accentHover:'#C06644', accentLight:'#F2DED5',
  surface:'#FDFCF8', surface2:'#EAE7DE', ink:'#2C2820', dust:'#7A7268',
  mist:'#B0A99E', border:'#D8D3C9', success:'#27AE60', info:'#2980B9', error:'#C0392B'
};

// ---------- tiny SVG icons ----------
const Icon = {
  search: (p)=> <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>,
  save:   (p)=> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>,
  download:(p)=> <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>,
  undo:   (p)=> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5h-4"/></svg>,
  redo:   (p)=> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h4"/></svg>,
  refresh:(p)=> <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg>,
  open:   (p)=> <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>,
  more:   (p)=> <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" {...p}><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>,
  arrUp:  (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" {...p}><path d="m6 14 6-6 6 6"/></svg>,
  arrDown:(p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" {...p}><path d="m6 10 6 6 6-6"/></svg>,
  plus:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" {...p}><path d="M12 5v14M5 12h14"/></svg>,
  gear:   (p)=> <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>,
  caret:  (p)=> <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M7 10l5 5 5-5z"/></svg>,
  bold:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" {...p}><path d="M7 5h6a4 4 0 0 1 0 8H7zM7 13h7a4 4 0 0 1 0 8H7z"/></svg>,
  italic: (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" {...p}><path d="M19 4h-9M14 20H5M15 4 9 20"/></svg>,
  under:  (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" {...p}><path d="M6 4v8a6 6 0 0 0 12 0V4M5 21h14"/></svg>,
  strike: (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" {...p}><path d="M4 12h16M7 6c0-1.5 2-3 5-3s5 1 5 3"/><path d="M17 12c1 1 1.5 2 1.5 3 0 2.5-2.5 4-5.5 4s-5-1.5-5-3"/></svg>,
  link:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" {...p}><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>,
  sigma:  (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" {...p}><path d="M18 6H6l6 6-6 6h12"/></svg>,
  drag:   (p)=> <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor" {...p}><circle cx="2.5" cy="2" r="1.2"/><circle cx="2.5" cy="7" r="1.2"/><circle cx="2.5" cy="12" r="1.2"/><circle cx="7.5" cy="2" r="1.2"/><circle cx="7.5" cy="7" r="1.2"/><circle cx="7.5" cy="12" r="1.2"/></svg>,
  page:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>,
  user:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/></svg>,
  abstract:(p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>,
  para:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><path d="M13 4v16M17 4v16M9 4h8a4 4 0 0 1 0 8H9z"/></svg>,
  list:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/></svg>,
  code:   (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><path d="m16 6 4 6-4 6M8 6l-4 6 4 6"/></svg>,
  fig:    (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m3 18 5-5 5 5 4-4 4 4"/></svg>,
  table:  (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18M3 16h18M9 4v16M15 4v16"/></svg>,
  ref:    (p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><path d="M4 4v16h16"/><path d="M8 16V8M12 16v-5M16 16v-9"/></svg>,
  pageBreak:(p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeDasharray="3 2" {...p}><path d="M3 12h18"/></svg>,
  heading:(p)=> <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" {...p}><path d="M6 4v16M18 4v16M6 12h12"/></svg>,
};

// ---------- the wordmark ----------
function Wordmark(){
  return (
    <span style={{display:'inline-flex',alignItems:'baseline',gap:6,fontFamily:'"Source Serif 4", Georgia, serif'}}>
      <span style={{
        color: C.accent, fontWeight:700, fontSize:13, letterSpacing:'-0.5px',
        fontFeatureSettings:'"ss01"',
      }}>«</span>
      <span style={{fontWeight:600, fontSize:12.5, letterSpacing:'.02em', color:C.ink}}>obj.Paper</span>
      <span style={{color:C.dust, fontSize:12, fontWeight:400}}>— my_paper.pw</span>
      <span style={{
        width:6, height:6, borderRadius:'50%',
        background: C.accent, marginLeft:2, alignSelf:'center',
        boxShadow:`0 0 0 2px ${C.accentLight}`
      }}/>
    </span>
  );
}

// ---------- macOS title bar ----------
function TitleBar(){
  return (
    <div style={{
      height:36, background:'linear-gradient(180deg,#EFEAD9 0%, #E8E2CF 100%)',
      borderBottom:`1px solid ${C.border}`,
      display:'flex', alignItems:'center', padding:'0 14px',
      borderRadius:'10px 10px 0 0', position:'relative',
    }}>
      <div style={{display:'flex', gap:8}}>
        {['#FF5F57','#FEBC2E','#28C840'].map((c,i)=>(
          <div key={i} style={{width:12,height:12,borderRadius:'50%',background:c,boxShadow:'inset 0 0 0 .5px rgba(0,0,0,.18)'}}/>
        ))}
      </div>
      <div style={{position:'absolute', left:'50%', transform:'translateX(-50%)'}}>
        <Wordmark/>
      </div>
    </div>
  );
}

// ---------- menu bar ----------
function MenuBar(){
  const items = ['File','Edit','View','Insert','Format','Help'];
  return (
    <div style={{
      height:28, background: C.surface,
      borderBottom:`1px solid ${C.border}`,
      display:'flex', alignItems:'center', padding:'0 14px', gap:18,
    }}>
      {items.map((it,i)=>(
        <span key={it} style={{
          fontSize:12, color:C.ink, fontWeight: i===0?500:400,
          padding:'3px 8px', borderRadius:4, cursor:'default',
          background: i===0 ? C.surface2 : 'transparent'
        }}>{it}</span>
      ))}
      <div style={{flex:1}}/>
      <span style={{fontSize:11, color:C.dust, fontFamily:'"JetBrains Mono", monospace', letterSpacing:'.04em'}}>
        v1.0.0 · MIT
      </span>
    </div>
  );
}

// ---------- toolbar ----------
function Toolbar(){
  const TB_BTN = {
    height:28, padding:'0 10px', borderRadius:6, border:`1px solid ${C.border}`,
    background: C.bg, color:C.ink, fontSize:12, display:'inline-flex',
    alignItems:'center', gap:6, cursor:'default'
  };
  return (
    <div style={{
      height:48, background: C.surface, borderBottom:`1px solid ${C.border}`,
      display:'flex', alignItems:'center', padding:'0 14px', gap:8,
    }}>
      {/* Save */}
      <button style={{...TB_BTN, background:C.accent, color:'#fff', border:`1px solid ${C.accent}`, fontWeight:500, boxShadow:'0 1px 0 rgba(255,255,255,.25) inset, 0 1px 2px rgba(192,102,68,.4)'}}>
        <Icon.save /> 저장
      </button>
      {/* Export (outlined) */}
      <button style={{...TB_BTN, color:C.accent, borderColor:C.accent, background:'#fff'}}>
        <Icon.download /> 내보내기 <Icon.caret style={{marginLeft:2}}/>
      </button>

      <div style={{width:1, height:20, background:C.border, margin:'0 4px'}}/>

      <button style={TB_BTN}><Icon.undo /></button>
      <button style={TB_BTN}><Icon.redo /></button>

      <div style={{width:1, height:20, background:C.border, margin:'0 4px'}}/>

      <button style={{...TB_BTN, fontFamily:'"Source Serif 4", Georgia, serif', fontWeight:700, padding:'0 9px'}}>B</button>
      <button style={{...TB_BTN, fontFamily:'"Source Serif 4", Georgia, serif', fontStyle:'italic', padding:'0 9px'}}>I</button>
      <button style={{...TB_BTN, fontFamily:'"Source Serif 4", Georgia, serif', textDecoration:'underline', padding:'0 9px'}}>U</button>
      <button style={{...TB_BTN, fontFamily:'"Source Serif 4", Georgia, serif', textDecoration:'line-through', padding:'0 9px'}}>S</button>

      <div style={{width:1, height:20, background:C.border, margin:'0 4px'}}/>

      <button style={{...TB_BTN, fontFamily:'"JetBrains Mono", monospace', padding:'0 9px'}}>∑</button>
      <button style={TB_BTN}><Icon.link /></button>

      <div style={{flex:1}}/>

      {/* breadcrumbs of doc */}
      <span style={{
        fontSize:11, color:C.dust, fontFamily:'"JetBrains Mono", monospace',
        background:C.bg, padding:'4px 8px', borderRadius:4, border:`1px solid ${C.border}`
      }}>
        General · A4 · Times NR 12pt
      </span>

      <div style={{width:1, height:20, background:C.border, margin:'0 4px'}}/>

      {/* language */}
      <button style={{
        ...TB_BTN, padding:'0 10px', background: C.accentLight,
        borderColor: C.accent, color: C.accent, fontWeight:500
      }}>
        한국어 <Icon.caret style={{marginLeft:2}}/>
      </button>
    </div>
  );
}

// ---------- left palette ----------
const paletteData = [
  { group:'STRUCTURE', items:[
    { id:'title', label:'Title', icon:Icon.page },
    { id:'authors', label:'Authors', icon:Icon.user },
    { id:'abstract', label:'Abstract', icon:Icon.abstract },
    { id:'pagebreak', label:'Page Break', icon:Icon.pageBreak, hint:'⌥⏎' },
  ]},
  { group:'CONTENT', items:[
    { id:'heading', label:'Heading', icon:Icon.heading },
    { id:'paragraph', label:'Paragraph', icon:Icon.para, active:true },
    { id:'list', label:'List', icon:Icon.list },
    { id:'code', label:'Code', icon:Icon.code },
  ]},
  { group:'ACADEMIC', items:[
    { id:'equation', label:'Equation', icon:Icon.sigma },
    { id:'figure', label:'Figure', icon:Icon.fig },
    { id:'table', label:'Table', icon:Icon.table },
    { id:'references', label:'References', icon:Icon.ref },
  ]},
];

function PaletteItem({item}){
  const Ic = item.icon;
  const active = item.active;
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:10,
      padding:'6px 10px', borderRadius:6, fontSize:12,
      color: active ? C.accent : C.ink,
      background: active ? C.accentLight : 'transparent',
      border: active ? `1px solid ${C.accent}` : '1px solid transparent',
      cursor:'grab', userSelect:'none',
    }}>
      <span style={{
        width:22, height:22, borderRadius:4,
        background: active ? '#fff' : C.bg,
        border: `1px solid ${active ? C.accent : C.border}`,
        color: active ? C.accent : C.dust,
        display:'inline-flex', alignItems:'center', justifyContent:'center', flex:'0 0 auto'
      }}>
        <Ic />
      </span>
      <span style={{flex:1, fontWeight: active? 500 : 400}}>{item.label}</span>
      {item.hint && <span style={{fontSize:10, color:C.mist, fontFamily:'"JetBrains Mono", monospace'}}>{item.hint}</span>}
    </div>
  );
}

function Palette(){
  return (
    <aside style={{
      width:240, flex:'0 0 240px', background:C.surface,
      borderRight:`1px solid ${C.border}`,
      display:'flex', flexDirection:'column', overflow:'hidden'
    }}>
      {/* search */}
      <div style={{padding:'12px 12px 8px'}}>
        <div style={{
          height:30, borderRadius:7, background:C.bg, border:`1px solid ${C.border}`,
          display:'flex', alignItems:'center', padding:'0 10px', gap:8,
          color:C.mist, fontSize:12,
        }}>
          <Icon.search /> 블록 검색...
          <span style={{
            marginLeft:'auto', padding:'1px 5px', borderRadius:3, fontSize:10,
            background: C.surface, border:`1px solid ${C.border}`, color:C.dust,
            fontFamily:'"JetBrains Mono", monospace'
          }}>⌘K</span>
        </div>
      </div>

      <div style={{flex:1, overflow:'hidden', padding:'4px 8px'}}>
        {paletteData.map(g=>(
          <div key={g.group} style={{marginBottom:14}}>
            <div style={{
              display:'flex', alignItems:'center', gap:8,
              padding:'8px 6px 6px',
            }}>
              <span style={{
                fontSize:10, fontWeight:600, color:C.accent,
                letterSpacing:'.14em',
              }}>{g.group}</span>
              <div style={{flex:1, height:1, background:C.border}}/>
              <Icon.caret style={{color:C.mist}}/>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:2}}>
              {g.items.map(it=> <PaletteItem key={it.id} item={it} />)}
            </div>
          </div>
        ))}

        {/* Templates */}
        <div style={{marginBottom:14}}>
          <div style={{display:'flex', alignItems:'center', gap:8, padding:'8px 6px 6px'}}>
            <span style={{fontSize:10, fontWeight:600, color:C.accent, letterSpacing:'.14em'}}>TEMPLATES</span>
            <div style={{flex:1, height:1, background:C.border}}/>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, padding:'2px 4px'}}>
            {['IEEE','ACM','Nature','LNCS','APA','General'].map((t,i)=>(
              <div key={t} style={{
                height:26, borderRadius:5, fontSize:11,
                display:'flex', alignItems:'center', justifyContent:'center',
                background: i===5 ? C.accent : C.accentLight,
                color: i===5 ? '#fff' : C.accent,
                border: `1px solid ${i===5 ? C.accent : 'transparent'}`,
                fontWeight: i===5 ? 500 : 400, letterSpacing:'.02em'
              }}>{t}</div>
            ))}
          </div>
        </div>
      </div>

      {/* footer hint */}
      <div style={{
        padding:'10px 14px', borderTop:`1px solid ${C.border}`,
        fontSize:10.5, color:C.dust, lineHeight:1.5,
        background:'linear-gradient(180deg, transparent, rgba(234,231,222,.4))'
      }}>
        <span style={{color:C.mist}}>Tip ·</span> 블록을 캔버스로 끌어다 놓거나 더블클릭으로 삽입하세요.
      </div>
    </aside>
  );
}

// ---------- canvas / blocks ----------
function BlockBadge({label, color, mode='filled'}){
  const filled = mode==='filled';
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', height:18, padding:'0 7px',
      borderRadius:4, fontSize:9.5, fontWeight:600, letterSpacing:'.12em',
      background: filled ? color : 'transparent',
      color: filled ? '#fff' : color,
      border: filled ? 'none' : `1px solid ${color}`,
      fontFamily:'"JetBrains Mono", monospace',
    }}>{label}</span>
  );
}

function BlockChrome({badge, badgeColor='#7A7268', state='idle', children, controls=true, dragHandle=true}){
  // state: idle | hover | selected
  const isSel = state==='selected';
  const isHover = state==='hover';
  return (
    <div style={{
      position:'relative',

      background: isSel ? C.accentLight : C.surface,

      padding: isSel ? '13px 14px' : '14px 15px',
      transition:'all .15s',
      boxShadow: isSel ? '0 1px 0 rgba(217,119,87,.18)' : 'none',
    }}>
      {/* badge top-left */}
      <div style={{
        position:'absolute', top:-9, left:14,
      }}>
        <BlockBadge label={badge} color={badgeColor}/>
      </div>

      {/* drag handle (left) */}
      {dragHandle && (isHover || isSel) && (
        <div style={{
          position:'absolute', left:-22, top:'50%', transform:'translateY(-50%)',
          color: C.mist, cursor:'grab', padding:4
        }}>

        </div>
      )}

      {/* controls top-right */}
      {controls && (isHover || isSel) && (
        <div style={{
          position:'absolute', top:8, right:10, display:'flex', gap:2,
          background: isSel ? C.surface : C.bg,
          padding:'2px 4px', borderRadius:6,

          <button style={ctrlBtn}><Icon.arrDown/></button>
          <button style={ctrlBtn}><Icon.more/></button>
        </div>

      {children}
    </div>
  );
