[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obj-paper"
version = "1.0.0"
description = "Block-based academic paper editor with live PDF preview"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LShift" }]
requires-python = ">=3.11"
keywords = ["academic", "latex", "pdf", "editor", "pyqt6", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
  "Topic :: Text Editors",
]
dependencies = [
  "PyQt6>=6.6",
  "matplotlib>=3.8",
  "Pygments>=2.17",
]

[project.scripts]
obj-paper = "obj_paper.__main__:main"

[tool.setuptools.packages.find]
include = ["obj_paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
